<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluxogramas ColmeIA Flowchart</title>
  <link rel="stylesheet" href="static/css/flowchart.css">
   <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐝</text></svg>">
</head>
<body>

  <!-- Barra Superior de Controle -->
  <header class="bar">
    <div class="brand">
      <span class="logo-icon">🐝</span>
      <h1>Criador de Fluxogramas ColmeIA</h1>
    </div>
    <div class="actions">
        <button type="button" id="toggle-sidebar-btn" onclick="toggleSidebar()">👁️ Ocultar Controles</button>
        <button type="button" class="primary" onclick="createNewHtmlFile()">📄 Novo</button>
        <button type="button" class="btn-danger-text" onclick="clearAllNodes()">🗑️ Limpar Tudo</button>
        <button type="button" id="import-btn">📂 Carregar Rascunho</button>
        <button type="button" id="export-json-btn">💾 Baixar JSON</button>
        <button type="button" id="save-html-btn" class="primary">⚡ Baixar HTML Pronto</button>
        <button type="button" id="print-btn">🖨️ Imprimir / PDF</button>
        <button type="button" id="ajuda-btn" onclick="window.open('ajuda.html', '_blank')">❓ Ajuda</button>
    </div>
  </header>

  <!-- Janela Principal Dividida -->
  <div class="app-layout">
    
    <!-- Painel Lateral: Editor Estrutural -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Estrutura do Fluxo</h2>
        <p class="help-text">Monte seu fluxo adicionando blocos na raiz ou nos ramos das decisões.</p>
      </div>

      <!-- Barra Rápida de Inserção na Raiz -->
      <div class="quick-add-bar">
        <span class="quick-add-title">➕ Adicionar na Raiz:</span>
        <div class="quick-buttons">
          <button type="button" class="btn-node btn-start" onclick="addNodeToRoot('start')">Root</button>
          <button type="button" class="btn-node btn-msg" onclick="addNodeToRoot('msg')">Fraseologia</button>
          <!--<button type="button" class="btn-node btn-button" onclick="addNodeToRoot('button')">Botões</button>-->
          <button type="button" class="btn-node btn-decision" onclick="addNodeToRoot('decision')">Decisão</button>
          <button type="button" class="btn-node btn-api" onclick="addNodeToRoot('api')">API</button>
          <button type="button" class="btn-node btn-end" onclick="addNodeToRoot('end')">Fim do Bot</button>
          <button type="button" class="btn-node btn-data" onclick="addNodeToRoot('data')">Base Dados</button>
          <button type="button" class="btn-node btn-function" onclick="addNodeToRoot('function')">Função</button>
          <button type="button" class="btn-node btn-metadado" onclick="addNodeToRoot('metadado')">Metadado</button>
          <button type="button" class="btn-node btn-menu" onclick="addNodeToRoot('menu')">Item de Menu</button>
          <button type="button" class="btn-node btn-forms" onclick="addNodeToRoot('forms')">ColmeIA Forms</button>
          <button type="button" class="btn-node btn-validation" onclick="addNodeToRoot('validation')">Validação</button>
          <button type="button" class="btn-node btn-human" onclick="addNodeToRoot('human')">Atendimento Humano</button>
          <button type="button" class="btn-node btn-hub" onclick="addNodeToRoot('hub')">Decision Hub</button>
          <button type="button" class="btn-node btn-journey" onclick="addNodeToRoot('journey')">Próxima Jornada</button>
        </div>
      </div>

      <!-- Lista de Cards Editor -->
      <div id="tree-editor" class="tree-editor">
      </div>
    </aside>

    <!-- Canvas de Visualização em Tempo Real -->
    <main class="canvas-viewport">
      <div class="wrap">
        <div class="stage" id="flowchart-canvas">
          <!-- O fluxo visual é montado aqui -->
        </div>
      </div>
    </main>

  </div>

  <input type="file" id="import-file" accept=".json" style="display: none;">

  <!-- Script do Motor do Editor -->
  <script src="static/js/index.js"></script>
</body>
</html>
